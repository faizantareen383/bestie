<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meri Pyari Dost 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="3" data-total="8">
  <div class="hearts"></div>

  <main class="card">
    <h1>Tumhari Smile 😊</h1>
    <p>Tumhari smile sabse pyari hai Nimooo. Neeche scratch karke ek chhota sa compliment dekho 🌷</p>
    <div class="scratch" id="scratchCard">
      <div class="under"><div class="love-sticker" role="img" aria-label="A little animated heart gift"><span class="sticker-heart">💖</span><span class="sticker-spark">✨</span><span class="sticker-caption">Tumhari smile = magic</span></div></div>
      <canvas id="scratchCanvas" aria-label="Scratch to reveal the message"></canvas>
    </div>
    <p class="hint" id="scratchHint">Ungli se scratch karo ✨</p>
    <button class="btn hidden" id="nextBtn" data-next="page4.html">Next 🍓</button>
  </main>

  <div class="dots"></div>
  <script src="script.js"></script>
</body>
</html>
