<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meri Pyari Dost 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="4" data-total="8">
  <div class="hearts"></div>

  <main class="card">
    <h1> Pyari Bestiee ❤️🫶🏻</h1>
    <p>Har card palat kar dekho. Har ek mein tumhare liye ek MassageSS hai 🦋</p>
    <div class="flip-grid" id="flipGrid">
      <button class="flip" type="button"><span class="flip-inner"><span class="face front emoji">🌸</span><span class="face back">Tumhari dosti meri favourite hai 💖</span></span></button>
      <button class="flip" type="button"><span class="flip-inner"><span class="face front emoji">🦋</span><span class="face back">Tum har din ko behtar banati ho ✨</span></span></button>
      <button class="flip" type="button"><span class="flip-inner"><span class="face front emoji">🍓</span><span class="face back">Tumhari smile lajawab hai 😊</span></span></button>
      <button class="flip" type="button"><span class="flip-inner"><span class="face front emoji">🎀</span><span class="face back">Lucky hoon ke tum meri dost ho 🥹</span></span></button>
    </div>
    <p class="hint" id="flipHint">Baaki cards palto: 0 / 4</p>
    <button class="btn hidden" id="nextBtn" data-next="page5.html">Next 🎀</button>
  </main>

  <div class="dots"></div>
  <script src="script.js"></script>
</body>
</html>
